<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Infographic và video</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px;
      font-family: Arial, sans-serif;
      color: #263238;
      background: #f3f6f8;
    }

    main {
      width: min(900px, 100%);
      margin: 0 auto;
      padding: 32px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 28px rgb(0 0 0 / 8%);
    }

    h1 {
      margin-top: 0;
      color: #174a68;
      text-align: center;
    }

    .description {
      max-width: 680px;
      margin: 0 auto 28px;
      color: #54656f;
      line-height: 1.6;
      text-align: center;
    }

    .infographic {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto 32px;
      border-radius: 10px;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      overflow: hidden;
      border-radius: 10px;
      background: #e8eef1;
    }

    .video-wrapper iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    footer {
      margin-top: 28px;
      color: #718087;
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 600px) {
      main {
        padding: 24px 18px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Tiêu đề infographic</h1>

    <p class="description">
      Đoạn mô tả ngắn giới thiệu nội dung chính của infographic và video.
    </p>

    <img
    class="infographic"
    src="./infographic.png"
    alt="Infographic minh họa nội dung"
>

    <div class="video-wrapper">
  <iframe
    src="https://www.youtube.com/embed/i3PH_wF4c5M?autoplay=1&mute=1&playsinline=1"
    title="Video YouTube liên quan"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen>
  </iframe>
</div>

    <footer>
      © 2026 · Nội dung và infographic được tạo với sự hỗ trợ của AI.
    </footer>
  </main>
</body>
</html>
